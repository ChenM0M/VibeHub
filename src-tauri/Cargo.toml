[package]
name = "vibehub"
version = "3.3.8"
description = "A cross-platform launcher for development tools"
authors = ["VibeHub"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6.0.0"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
dashmap = "5.5"
sha2 = "0.10"
async-stream = "0.3"
futures = "0.3"
bytes = "1"
vibehub-core = { path = "../crates/vibehub-core" }
vibehub-adapters = { package = "vibehub-cli", path = "../crates/vibehub-cli" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
