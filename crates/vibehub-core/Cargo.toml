[package]
name = "vibehub-core"
version = "2.0.0-pre.16"
description = "Core VibeHub workflow engine"
authors = ["VibeHub"]
license = "Apache-2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
