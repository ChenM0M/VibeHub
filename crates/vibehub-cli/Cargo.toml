[package]
name = "vibehub-cli"
version = "3.3.0"
description = "Command line interface for VibeHub Core"
authors = ["VibeHub"]
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "vibehub-cli"
path = "src/main.rs"

[[bin]]
name = "vibehub"
path = "src/main.rs"

[lib]
name = "vibehub_adapters"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "signal"] }
uuid = { version = "1.8", features = ["v4"] }
vibehub-core = { path = "../vibehub-core" }
