name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app
            dmg_arch: aarch64
          - platform: macos-latest
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app
            dmg_arch: x64
          - platform: windows-latest
            rust_targets: ''
            tauri_args: ''
            dmg_arch: ''
          - platform: ubuntu-22.04
            rust_targets: ''
            tauri_args: ''
            dmg_arch: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and upload Tauri bundles
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: VibeHub ${{ inputs.tag || github.ref_name }}
          args: ${{ matrix.tauri_args }} ${{ matrix.platform == 'windows-latest' && contains(inputs.tag || github.ref_name, '-') && '--bundles nsis' || '' }}
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          releaseBody: |
            ## 发布前检查 / Before Publishing

            - [ ] macOS Apple Silicon DMG 可以打开并完成首次启动
            - [ ] macOS Intel DMG 可以打开并完成首次启动
            - [ ] macOS 签名/公证已通过，双击打开不会被 Gatekeeper 拦截
            - [ ] Windows / Linux 产物已上传
            - [ ] README 的安装命令和版本说明仍然准确
            - [ ] 如果要同步 Homebrew，请先发布本草稿 Release

            ## 更新内容 / What's New

            - macOS: 应用数据迁移到系统 Application Support 目录，避免安装版写入 `.app` 包导致启动失败。
            - macOS: 修复项目工具、CLI、终端打开方式。
            - Distribution: 发布后会触发 Homebrew cask 更新工作流。

            ## 下载说明 / Download Guide

            | 文件名 | 系统 | 类型 | 说明 |
            | --- | --- | --- | --- |
            | `VibeHub_*_aarch64.dmg` | macOS Apple Silicon | DMG | M1/M2/M3/M4 芯片 |
            | `VibeHub_*_x64.dmg` | macOS Intel | DMG | Intel 芯片 |
            | `VibeHub_*_x64-setup.exe` | Windows | 安装包 | 推荐，自动安装到系统 |
            | `VibeHub_*_x64_en-US.msi` | Windows | MSI | 企业部署，正式版提供 |
            | `VibeHub_*_amd64.deb` | Linux Debian/Ubuntu | DEB | `sudo dpkg -i xxx.deb` |
            | `VibeHub_*_amd64.AppImage` | Linux | AppImage | `chmod +x` 后运行 |

            ## Homebrew

            发布本草稿后，`Update Homebrew Cask` 工作流会更新 tap。预览版 / prerelease 也会使用同一套 Homebrew cask 指向当前已发布的 GitHub Release。用户可使用：

            ```bash
            brew install --cask chenm0m/vibehub/vibehub
            brew upgrade --cask vibehub
            ```

            如果 Homebrew workflow 没有运行，请检查 `ChenM0M/homebrew-vibehub` 是否存在，以及本仓库是否配置了 `HOMEBREW_TAP_TOKEN`。

      - name: Build macOS app bundle
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npm run tauri -- build ${{ matrix.tauri_args }}

      - name: Package macOS APFS DMG
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          APP_PATH="$(find target src-tauri/target -path '*/release/bundle/macos/VibeHub.app' -type d 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "VibeHub.app was not found under target/ or src-tauri/target/."
            find target src-tauri/target -path '*/release/bundle/macos' -type d -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p release-assets
          DMG_PATH="release-assets/VibeHub_${VERSION}_${DMG_ARCH}.dmg"
          hdiutil create -volname VibeHub -fs APFS -srcfolder "$APP_PATH" "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

      - name: Attach macOS APFS DMG
        if: startsWith(matrix.platform, 'macos')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*.dmg
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

      - name: Prepare portable executable (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          if (Test-Path "target\release\vibehub.exe") {
            Copy-Item "target\release\vibehub.exe" "VibeHub-Portable-Windows.exe"
          } else {
            Copy-Item "src-tauri\target\release\vibehub.exe" "VibeHub-Portable-Windows.exe"
          }
        shell: pwsh

      - name: Attach portable executable (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: VibeHub-Portable-Windows.exe
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true

      - name: Prepare portable executable (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          if [ -f "target/release/vibehub" ]; then
            cp target/release/vibehub VibeHub-Portable-Linux
          else
            cp src-tauri/target/release/vibehub VibeHub-Portable-Linux
          fi
          chmod +x VibeHub-Portable-Linux
          tar -czvf VibeHub-Portable-Linux.tar.gz VibeHub-Portable-Linux

      - name: Attach portable executable (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: VibeHub-Portable-Linux.tar.gz
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
