name: Build and Test

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate release metadata
        run: npm run release:check

      - name: Validate V3 contracts
        run: npm run v3:contracts:check

      - name: Format Rust code
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Build V3 CLI for MCP contract
        run: cargo build --locked -p vibehub-cli --bin vibehub

      - name: Validate packaged MCP contract
        run: npm run v3:mcp:check

      - name: Validate patch hygiene
        run: git diff --check

      - name: Build Tauri app
        if: matrix.platform != 'windows-latest'
        run: npm run tauri -- build

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version.Contains("-")) {
            npm run tauri -- build --bundles nsis
          } else {
            npm run tauri -- build
          }
