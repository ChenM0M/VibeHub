name: Build and Test

on:
  push:
    branches: [ main, dev, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}-rust

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate release metadata
        run: npm run release:check

      - name: Validate V3 contracts
        run: npm run v3:contracts:check

      - name: Format Rust code
        run: cargo fmt --all -- --check

      - name: Exclude build paths from Windows Defender
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Real-time scanning briefly holds handles on freshly written or
          # removed files, which breaks the store's rename/remove/lock
          # semantics tests with spurious ERROR_SHARING_VIOLATION and
          # delete-pending ACCESS_DENIED on windows-latest.
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue

      - name: Test Rust workspace
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/cargo-test.log"
          if cargo test --locked --workspace 2>&1 | tee "$log"; then
            exit 0
          fi

          summary="$(grep -Ei -C 4 'FAILED|panicked at|failures:|error:' "$log" | tail -n 80 | tr '\r\n' ' ' | cut -c1-3800 | sed 's/%/%25/g')"
          if [ -z "$summary" ]; then
            summary="$(tail -n 20 "$log" | tr '\r\n' ' ' | cut -c1-3800 | sed 's/%/%25/g')"
          fi
          echo "::error title=Rust workspace tests failed::$summary"
          exit 1

      - name: Build V3 CLI for MCP contract
        run: cargo build --locked -p vibehub-cli --bin vibehub

      - name: Validate packaged MCP contract
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/v3-mcp-contract.log"
          if npm run v3:mcp:check 2>&1 | tee "$log"; then
            exit 0
          fi

          summary="$(tail -n 40 "$log" | tr '\r\n' ' ' | cut -c1-3800 | sed 's/%/%25/g')"
          echo "::error title=Packaged MCP contract failed::$summary"
          exit 1

      - name: Validate patch hygiene
        run: git diff --check

      - name: Build Tauri app (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        run: npm run tauri -- build

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version.Contains("-")) {
            npm run tauri -- build --bundles nsis
          } else {
            npm run tauri -- build
          }
